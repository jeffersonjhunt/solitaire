# XcodeGen spec — the source of truth. The .xcodeproj is generated from it (and gitignored):
# `make` on the Mac and the apple-xcodebuild skill's xc-build.py both regenerate it before every
# build, using the XcodeGen pinned in .xcodegen-version (built once into a shared cache on the Mac).
name: Solitaire
options:
  bundleIdPrefix: com.oneoffendeavors
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SolitaireEngine:
    path: Packages/SolitaireEngine
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Solitaire:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources/Solitaire
      - Resources
    dependencies:
      - package: SolitaireEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneoffendeavors.solitaire
        PRODUCT_NAME: Solitaire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solitaire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Mac: App Sandbox with no capabilities beyond the defaults — no network client/server
        # entitlement, so the app cannot open a connection (spec: no network code at all).
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - SolitaireTests
        - SolitaireUITests
  SolitaireTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/SolitaireTests
    dependencies:
      - target: Solitaire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the iOS bundle layout (App.app/App) for every
        # destination; a macOS app keeps its binary under Contents/MacOS.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Solitaire.app/Contents/MacOS/Solitaire
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
  SolitaireUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/SolitaireUITests
    dependencies:
      - target: Solitaire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Solitaire
